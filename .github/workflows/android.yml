name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build native libraries, lint, test, and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK 37 and NDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;30.0.16248370" --channel=3

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          build-warnings: warn
          cache: false

      - name: Check out pinned EasyTier source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EasyTier/EasyTier
          ref: 8428a89d2dabc94c97d370ec607c6ca142473626
          path: build/easytier-v2.6.4
          persist-credentials: false

      - name: Cache EasyTier Cargo builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: build/easytier-v2.6.4 -> target

      - name: Build EasyTier JNI libraries for all Android ABIs
        run: bash tools/build-easytier-android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check Kotlin formatting
        run: ./gradlew :app:ktlintCheck

      - name: Run lint, unit tests, and debug assembly
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
