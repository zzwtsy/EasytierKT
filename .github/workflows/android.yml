name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build native libraries, lint, test, and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37 and NDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;27.2.12479018"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check out pinned EasyTier source
        uses: actions/checkout@v4
        with:
          repository: EasyTier/EasyTier
          ref: 8428a89d2dabc94c97d370ec607c6ca142473626
          path: build/easytier-v2.6.4
          persist-credentials: false

      - name: Cache EasyTier Cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: build/easytier-v2.6.4 -> target

      - name: Build EasyTier JNI libraries for all Android ABIs
        run: bash tools/build-easytier-android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Kotlin formatting
        run: ./gradlew :app:ktlintCheck

      - name: Run lint, unit tests, and debug assembly
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
